<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Настоящий геймпад</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <script src="/js/mobile-utils.js"></script>
    <style>
        html, body { width:100%; height:100%; margin:0; overflow:hidden; touch-action:none; overscroll-behavior:none; background:#020617; }
        body { padding:0!important; color:white; }
        .mobile-back-button { display:none!important; }
        .page { position:relative; width:100vw; height:100vh; background:radial-gradient(circle at 20% 30%,rgba(59,130,246,.24),transparent 32%), radial-gradient(circle at 80% 70%,rgba(16,185,129,.18),transparent 32%), #020617; }
        .portrait { display:none; position:fixed; inset:0; z-index:100; align-items:center; justify-content:center; text-align:center; background:#020617; padding:24px; box-sizing:border-box; }
        .portrait-card { max-width:420px; padding:28px; border-radius:28px; background:rgba(15,23,42,.96); border:1px solid rgba(255,255,255,.14); }
        .top { position:absolute; left:12px; right:12px; top:8px; height:44px; display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; z-index:10; }
        .top button { height:40px; border-radius:15px; border:1px solid rgba(255,255,255,.16); background:rgba(15,23,42,.72); color:white; font-weight:900; padding:0 12px; }
        .title { font-size:16px; font-weight:950; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .status { font-size:11px; color:rgba(255,255,255,.62); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .pad { position:absolute; inset:58px 12px 10px 12px; display:grid; grid-template-columns:1fr .65fr 1fr; gap:12px; }
        .side { position:relative; min-width:0; min-height:0; }
        .center { display:grid; grid-template-rows:auto 1fr auto; align-items:center; justify-items:center; gap:10px; }
        .shoulders { position:absolute; top:0; left:0; right:0; height:50px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .btn { border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.09); color:white; border-radius:18px; font-weight:950; touch-action:none; user-select:none; }
        .btn.active, .face.active, .shoulder.active, .sys.active { transform:scale(.94); filter:brightness(1.25); }
        .shoulder { border-radius:20px; font-size:14px; }
        .stick { position:absolute; left:5%; bottom:3%; width:min(33vw,245px); height:min(33vw,245px); border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.13),transparent 34%),rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.18); box-shadow:0 20px 48px rgba(0,0,0,.35); touch-action:none; }
        .stick:before { content:''; position:absolute; inset:21%; border-radius:50%; border:2px dashed rgba(255,255,255,.14); }
        .knob { position:absolute; left:50%; top:50%; width:34%; height:34%; border-radius:50%; background:linear-gradient(135deg,#2563eb,#60a5fa); border:3px solid rgba(255,255,255,.75); transform:translate(-50%,-50%); pointer-events:none; }
        .dpad { position:absolute; right:4%; bottom:8%; width:116px; height:116px; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:6px; }
        .dpad .up { grid-column:2; grid-row:1; } .dpad .left { grid-column:1; grid-row:2; } .dpad .right { grid-column:3; grid-row:2; } .dpad .down { grid-column:2; grid-row:3; }
        .dpad button { border-radius:12px; }
        .face-zone { position:absolute; right:6%; bottom:4%; width:min(33vw,250px); height:min(33vw,250px); }
        .face { position:absolute; width:32%; height:32%; border-radius:50%; border:3px solid rgba(255,255,255,.7); color:white; font-weight:950; font-size:20px; box-shadow:0 16px 36px rgba(0,0,0,.38); }
        .a { left:34%; bottom:0; background:rgba(16,185,129,.82); } .b { right:0; top:34%; background:rgba(239,68,68,.82); } .x { left:0; top:34%; background:rgba(59,130,246,.82); } .y { left:34%; top:0; background:rgba(245,158,11,.82); }
        .sys-row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:100%; }
        .sys { height:42px; border-radius:16px; font-size:12px; }
        .center-text { text-align:center; font-size:11px; color:rgba(255,255,255,.45); line-height:1.45; }
        .triggers { display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; }
        .trigger-wrap { height:44px; border-radius:17px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.08); overflow:hidden; position:relative; }
        .trigger-fill { position:absolute; left:0; bottom:0; top:0; width:0%; background:rgba(59,130,246,.45); }
        .trigger-label { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:950; font-size:12px; }
        .help { display:none; position:fixed; inset:12px; z-index:50; padding:20px; overflow:auto; border-radius:26px; background:rgba(15,23,42,.98); border:1px solid rgba(59,130,246,.35); }
        @media (orientation:portrait){ .portrait{display:flex;} }
        @media (max-height:480px) and (orientation:landscape){ .pad{inset:52px 8px 8px 8px; gap:8px;} .top{height:38px;} .stick{width:min(31vw,205px);height:min(31vw,205px);} .face-zone{width:min(31vw,205px);height:min(31vw,205px);} .dpad{width:94px;height:94px;} .shoulders{height:42px;} .face{font-size:16px;} }
    </style>
</head>
<body class="no-mobile-bottom-back">
<div class="page">
    <div class="top">
        <button onclick="goBack()">← Назад</button>
        <div><div class="title">🎮 Виртуальный Xbox-геймпад</div><div id="connectionStatus" class="status">🟡 Подключение...</div></div>
        <button onclick="requestFullscreenMode()">⛶</button>
    </div>
    <div class="pad">
        <div class="side">
            <div class="shoulders"><button class="btn shoulder hold" data-btn="lb">LB</button><button id="ltBtn" class="btn shoulder trigger" data-trigger="lt">LT</button></div>
            <div id="leftStick" class="stick"><div id="leftKnob" class="knob"></div></div>
            <div class="dpad"><button class="btn hold up" data-btn="dpadUp">▲</button><button class="btn hold left" data-btn="dpadLeft">◀</button><button class="btn hold right" data-btn="dpadRight">▶</button><button class="btn hold down" data-btn="dpadDown">▼</button></div>
        </div>
        <div class="center">
            <div class="sys-row"><button class="btn sys hold" data-btn="back">Back</button><button class="btn sys hold" data-btn="guide">Xbox</button><button class="btn sys hold" data-btn="start">Start</button></div>
            <div class="center-text">Телефон отправляет GAMEPAD_STATE<br>ПК видит Xbox 360 Controller</div>
            <div class="triggers"><div class="trigger-wrap" id="ltVisual"><div class="trigger-fill"></div><div class="trigger-label">LT</div></div><div class="trigger-wrap" id="rtVisual"><div class="trigger-fill"></div><div class="trigger-label">RT</div></div></div>
        </div>
        <div class="side">
            <div class="shoulders"><button class="btn shoulder hold" data-btn="rb">RB</button><button id="rtBtn" class="btn shoulder trigger" data-trigger="rt">RT</button></div>
            <div id="rightStick" class="stick" style="left:auto;right:5%;bottom:3%;opacity:.72"><div id="rightKnob" class="knob" style="background:linear-gradient(135deg,#10b981,#6ee7b7)"></div></div>
            <div class="face-zone"><button class="face y hold" data-btn="y">Y</button><button class="face x hold" data-btn="x">X</button><button class="face b hold" data-btn="b">B</button><button class="face a hold" data-btn="a">A</button></div>
        </div>
    </div>
</div>
<div class="portrait"><div class="portrait-card"><div style="font-size:56px">📱↔️</div><h2>Поверните телефон горизонтально</h2><p style="color:rgba(255,255,255,.65)">Геймпад работает только в горизонтальном режиме.</p></div></div>
<script>
    const token=localStorage.getItem('token'); if(!token) location.href='/login.html';
    const p=new URLSearchParams(location.search); const pcId=p.get('pcId'); const pcName=decodeURIComponent(p.get('pcName')||'ПК');
    if(!pcId){alert('ПК не выбран'); location.href='/pcs.html';}
    const wsProtocol=location.protocol==='https:'?'wss:':'ws:'; const wsPort=location.port||(location.protocol==='https:'?'443':'80'); const wsUrl=`${wsProtocol}//${location.hostname}:${wsPort}/ws/client`;
    let ws=null; let sendTimer=null;
    const state={lx:0,ly:0,rx:0,ry:0,lt:0,rt:0,a:false,b:false,x:false,y:false,lb:false,rb:false,back:false,start:false,guide:false,ls:false,rs:false,dpadUp:false,dpadDown:false,dpadLeft:false,dpadRight:false};
    function connectWs(){ws=new WebSocket(wsUrl); ws.onopen=()=>{document.getElementById('connectionStatus').innerText='🟢 Подключено к '+pcName; ws.send(JSON.stringify({type:'watch',pcId:+pcId,token,pcName,profile:'personal',platform:navigator.platform,browser:navigator.userAgent,mode:'Xbox-геймпад'})); sendCommand('GAMEPAD_CONNECT'); startSending();}; ws.onclose=()=>{document.getElementById('connectionStatus').innerText='🟡 Соединение закрыто'; stopSending();}; ws.onerror=()=>{document.getElementById('connectionStatus').innerText='🔴 Ошибка соединения';};}
    function sendCommand(action,data={}){if(!ws||ws.readyState!==WebSocket.OPEN)return; ws.send(JSON.stringify({type:'command',pcId:+pcId,action,profile:'personal',...data}));}
    function startSending(){if(sendTimer)return; sendTimer=setInterval(()=>sendCommand('GAMEPAD_STATE',state),33);}
    function stopSending(){if(sendTimer){clearInterval(sendTimer);sendTimer=null;} resetState(); sendCommand('GAMEPAD_DISCONNECT');}
    function resetState(){Object.keys(state).forEach(k=>state[k]=typeof state[k]==='boolean'?false:0); updateTriggerVisual('lt',0); updateTriggerVisual('rt',0);}
    function bindStick(zoneId,knobId,prefix){const zone=document.getElementById(zoneId),knob=document.getElementById(knobId); let pid=null; function upd(x,y){const r=zone.getBoundingClientRect(); const cx=r.left+r.width/2,cy=r.top+r.height/2; let dx=x-cx,dy=y-cy; const max=r.width*.33,d=Math.hypot(dx,dy); if(d>max){dx=dx/d*max;dy=dy/d*max;} knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`; state[prefix+'x']=Math.max(-1,Math.min(1,dx/max)); state[prefix+'y']=Math.max(-1,Math.min(1,dy/max));}
        zone.addEventListener('pointerdown',e=>{pid=e.pointerId; zone.setPointerCapture(pid); requestFullscreenMode(); upd(e.clientX,e.clientY); e.preventDefault();}); zone.addEventListener('pointermove',e=>{if(pid!==e.pointerId)return; upd(e.clientX,e.clientY); e.preventDefault();}); function end(e){if(pid!==null){pid=null; knob.style.transform='translate(-50%,-50%)'; state[prefix+'x']=0;state[prefix+'y']=0;} e&&e.preventDefault();} zone.addEventListener('pointerup',end); zone.addEventListener('pointercancel',end);}
    bindStick('leftStick','leftKnob','l'); bindStick('rightStick','rightKnob','r');
    document.querySelectorAll('.hold').forEach(b=>{const name=b.dataset.btn; b.addEventListener('pointerdown',e=>{requestFullscreenMode(); state[name]=true; b.classList.add('active'); e.preventDefault();}); const up=e=>{state[name]=false; b.classList.remove('active'); e&&e.preventDefault();}; b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('pointerleave',e=>{if(e.buttons===0)up(e);});});
    document.querySelectorAll('.trigger').forEach(b=>{const name=b.dataset.trigger; b.addEventListener('pointerdown',e=>{requestFullscreenMode(); state[name]=1; updateTriggerVisual(name,1); b.classList.add('active'); e.preventDefault();}); const up=e=>{state[name]=0; updateTriggerVisual(name,0); b.classList.remove('active'); e&&e.preventDefault();}; b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up);});
    function updateTriggerVisual(name,value){const el=document.querySelector('#'+name+'Visual .trigger-fill'); if(el)el.style.width=(value*100)+'%';}
    function requestFullscreenMode(){const el=document.documentElement; if(document.fullscreenElement)return; if(el.requestFullscreen)el.requestFullscreen().catch(()=>{}); else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();}
    function goBack(){stopSending(); location.href='/mobile-remote.html?pcId='+encodeURIComponent(pcId)+'&pcName='+encodeURIComponent(pcName);} window.addEventListener('beforeunload',stopSending); window.addEventListener('pagehide',stopSending); connectWs();
</script>
</body>
</html>
