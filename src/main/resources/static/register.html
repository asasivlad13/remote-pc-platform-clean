<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote PC - Register</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
<div class="glass-card fade-in-up" style="max-width: 400px; width: 100%; padding: 40px; text-align: center;">
    <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">📝</div>
    <h1 style="font-size: 28px; margin-bottom: 8px;">Create Account</h1>
    <p style="color: rgba(255,255,255,0.5); margin-bottom: 30px;">Sign up to get started</p>

    <form id="registerForm">
        <input type="text" id="username" class="input-field" placeholder="Username" style="margin-bottom: 16px;">
        <input type="password" id="password" class="input-field" placeholder="Password (min 6 chars)" style="margin-bottom: 16px;">
        <input type="password" id="confirmPassword" class="input-field" placeholder="Confirm Password" style="margin-bottom: 24px;">
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">Register</button>
    </form>

    <div id="error" style="margin-top: 16px; color: #f87171; font-size: 14px; display: none;"></div>
    <div id="success" style="margin-top: 16px; color: #34d399; font-size: 14px; display: none;"></div>

    <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1);">
        <p style="color: rgba(255,255,255,0.5); font-size: 14px;">Already have an account? <a href="/login.html" style="color: #3b82f6;">Sign In</a></p>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (password !== confirm) {
            errorDiv.innerText = 'Passwords do not match';
            errorDiv.style.display = 'block';
            return;
        }

        if (password.length < 6) {
            errorDiv.innerText = 'Password must be at least 6 characters';
            errorDiv.style.display = 'block';
            return;
        }

        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();

            if (response.ok) {
                successDiv.innerText = 'Registration successful! Redirecting to login...';
                successDiv.style.display = 'block';
                setTimeout(() => { window.location.href = '/login.html'; }, 2000);
            } else {
                errorDiv.innerText = data.error || 'Registration failed';
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            errorDiv.innerText = 'Network error';
            errorDiv.style.display = 'block';
        }
    });
</script>
</body>
</html>
