<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote PC - My Computers</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <script src="/js/mobile-utils.js"></script>

    <style>
        .scenario-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.78);
            backdrop-filter: blur(10px);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .scenario-modal {
            width: min(920px, 100%);
            background: rgba(15, 23, 42, 0.97);
            border: 1px solid rgba(59, 130, 246, 0.35);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
            padding: 24px;
            color: white;
        }

        .scenario-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 20px;
        }

        .scenario-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .scenario-subtitle {
            color: rgba(255, 255, 255, 0.55);
            font-size: 14px;
        }

        .scenario-close {
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border-radius: 12px;
            padding: 8px 12px;
            cursor: pointer;
        }

        .scenario-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
        }

        .scenario-card {
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: white;
            border-radius: 18px;
            padding: 16px;
            cursor: pointer;
            transition: 0.18s ease;
            min-height: 160px;
        }

        .scenario-card:hover {
            transform: translateY(-2px);
            border-color: rgba(59, 130, 246, 0.65);
            background: rgba(59, 130, 246, 0.14);
        }

        .scenario-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .scenario-card.disabled:hover {
            transform: none;
            border-color: rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
        }

        .scenario-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .scenario-name {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .scenario-description {
            color: rgba(255, 255, 255, 0.58);
            font-size: 13px;
            line-height: 1.4;
        }

        .scenario-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 11px;
            background: rgba(16, 185, 129, 0.16);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        .scenario-badge.soon {
            background: rgba(245, 158, 11, 0.14);
            color: #fbbf24;
            border-color: rgba(245, 158, 11, 0.35);
        }

        .mobile-back-button {
            display: none;
        }

        #mobileRemoteScenarioCard {
            display: none;
        }

        #desktopRemoteScenarioCard {
            display: block;
        }

        @media (max-width: 900px), (pointer: coarse) {
            body {
                padding: 14px !important;
                padding-bottom: 86px !important;
            }

            .scenario-modal-backdrop {
                padding: 12px;
                align-items: flex-end;
            }

            .scenario-modal {
                width: 100%;
                max-height: 92vh;
                overflow-y: auto;
                border-radius: 22px 22px 16px 16px;
                padding: 18px;
            }

            .scenario-header {
                align-items: center;
            }

            .scenario-title {
                font-size: 21px;
            }

            .scenario-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .scenario-card {
                min-height: 132px;
                padding: 16px;
            }

            #pcsGrid {
                grid-template-columns: 1fr !important;
                gap: 16px !important;
            }

            .pc-card {
                padding: 18px !important;
                border-radius: 20px !important;
            }

            .top-actions {
                width: 100%;
                display: grid !important;
                grid-template-columns: 1fr;
                gap: 10px !important;
            }

            .top-actions .btn-glass {
                width: 100%;
                justify-content: center;
            }

            .mobile-back-button {
                position: fixed;
                left: 14px;
                right: 14px;
                bottom: 14px;
                z-index: 700;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 52px;
                border-radius: 18px;
                border: 1px solid rgba(255, 255, 255, 0.16);
                background: rgba(15, 23, 42, 0.94);
                color: white;
                font-size: 16px;
                font-weight: 700;
                backdrop-filter: blur(12px);
                box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
                cursor: pointer;
            }
        }
    </style>
</head>

<body style="padding: 24px;">

<button class="mobile-back-button" onclick="goMobileBack()">
    ← Назад
</button>

<div style="max-width: 1200px; margin: 0 auto;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 16px;">
        <div class="fade-in-up">
            <h1 style="font-size: 32px;">My Computers</h1>
            <p style="color: rgba(255,255,255,0.5);">Manage your remote devices</p>
        </div>

        <div class="top-actions" style="display: flex; gap: 12px; flex-wrap: wrap;">
            <button id="returnTeacherSessionBtn" onclick="returnToActiveTeacherSession()" class="btn-glass" style="display:none;">
                🔁 Вернуться в учебную сессию
            </button>

            <button id="returnSupportSessionBtn" class="btn-glass" style="display:none;">
                🛠 Вернуться в техподдержку
            </button>

            <button onclick="location.href='/education-join.html'" class="btn-glass">
                🎓 Войти в учебную сессию
            </button>

            <button onclick="location.href='/support-join.html'" class="btn-glass">
                🛠 Войти в техподдержку
            </button>

            <button onclick="location.href='/history.html'" class="btn-glass">📊 История</button>
            <button onclick="location.href='/change-password.html'" class="btn-glass">🔒 Change Password</button>
            <button onclick="logout()" class="btn-glass">🚪 Logout</button>
        </div>
    </div>

    <div id="pcsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px;">
        <div style="grid-column: 1/-1; text-align: center; padding: 60px;">
            <div class="loading-spinner" style="margin: 0 auto;"></div>
            <p style="margin-top: 20px;">Loading computers...</p>
        </div>
    </div>
</div>

<div id="scenarioModalBackdrop" class="scenario-modal-backdrop">
    <div class="scenario-modal">
        <div class="scenario-header">
            <div>
                <div class="scenario-title">Выберите сценарий подключения</div>
                <div class="scenario-subtitle" id="scenarioPcName">ПК: —</div>
            </div>

            <button class="scenario-close" onclick="closeScenarioModal()">✕</button>
        </div>

        <div class="scenario-grid">
            <button class="scenario-card" onclick="connectWithProfile('personal')">
                <div class="scenario-icon">💻</div>
                <div class="scenario-name">Личный доступ</div>
                <div class="scenario-description">
                    Полное подключение к своему ПК: экран, мышь, клавиатура, файлы, питание и история.
                </div>
                <span class="scenario-badge">Доступно</span>
            </button>

            <button class="scenario-card" onclick="location.href='/education-create.html'">
                <div class="scenario-icon">🎓</div>
                <div class="scenario-name">Создать учебную сессию</div>
                <div class="scenario-description">
                    Создать новую учебную сессию для демонстрации экрана преподавателя и подключения учеников.
                </div>
                <span class="scenario-badge">Доступно</span>
            </button>

            <button class="scenario-card" onclick="openSupportCreatePage()">
                <div class="scenario-icon">🛠</div>
                <div class="scenario-name">Техподдержка</div>
                <div class="scenario-description">
                    Создать код помощи. Клиент войдёт по коду, а его ПК определится автоматически.
                </div>
                <span class="scenario-badge">Доступно</span>
            </button>

            <button id="mobileRemoteScenarioCard"
                    class="scenario-card"
                    onclick="openMobileRemote()">
                <div class="scenario-icon">📱</div>
                <div class="scenario-name">Многофункциональный пульт</div>
                <div class="scenario-description">
                    Управление презентацией, звуком, тачпадом, рисованием и игровым джойстиком с телефона или планшета.
                </div>
                <span class="scenario-badge">Мобильный режим</span>
            </button>

            <button id="desktopRemoteScenarioCard"
                    class="scenario-card disabled"
                    onclick="showScenarioInProgress('presentation_remote')">
                <div class="scenario-icon">📱</div>
                <div class="scenario-name">Презентация / пульт</div>
                <div class="scenario-description">
                    Мобильный интерфейс для управления презентацией, мультимедиа, тачпадом или джойстиком. Доступен только с телефона или планшета.
                </div>
                <span class="scenario-badge soon">Только мобильная версия</span>
            </button>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');

    if (!token) {
        window.location.href = '/login.html';
    }

    let pcsCache = [];
    let selectedPcId = null;
    let selectedPcName = null;

    function isCurrentDeviceMobile() {
        if (typeof isMobileDevice === 'function') {
            return isMobileDevice();
        }

        return window.innerWidth <= 900 ||
            /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    }

    function applyPcsMobileState() {
        const mobileCard = document.getElementById('mobileRemoteScenarioCard');
        const desktopCard = document.getElementById('desktopRemoteScenarioCard');

        if (isCurrentDeviceMobile()) {
            document.body.classList.add('mobile-device');

            if (mobileCard) {
                mobileCard.style.display = 'block';
            }

            if (desktopCard) {
                desktopCard.style.display = 'none';
            }
        } else {
            document.body.classList.remove('mobile-device');

            if (mobileCard) {
                mobileCard.style.display = 'none';
            }

            if (desktopCard) {
                desktopCard.style.display = 'block';
            }
        }
    }

    function goMobileBack() {
        const modal = document.getElementById('scenarioModalBackdrop');

        if (modal && modal.style.display === 'flex') {
            closeScenarioModal();
            return;
        }

        if (window.history.length > 1) {
            window.history.back();
            return;
        }

        window.location.href = '/pcs.html';
    }

    async function returnToActiveTeacherSession() {
        try {
            const response = await fetch('/api/education/sessions/my-active/teacher', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.status === 204) {
                alert('У вас нет активной учебной сессии');
                return;
            }

            if (!response.ok) {
                throw new Error(await response.text());
            }

            const session = await response.json();

            window.location.href =
                '/education-teacher.html?code=' + encodeURIComponent(session.sessionCode);

        } catch (e) {
            alert('Ошибка возврата в активную сессию: ' + e.message);
        }
    }

    async function checkActiveTeacherSession() {
        const btn = document.getElementById('returnTeacherSessionBtn');

        if (!btn) {
            return;
        }

        btn.style.display = 'none';

        try {
            const response = await fetch('/api/education/sessions/my-active/teacher', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok && response.status !== 204) {
                btn.style.display = 'inline-flex';
            } else {
                btn.style.display = 'none';
            }
        } catch (e) {
            console.warn('Teacher session check failed:', e);
            btn.style.display = 'none';
        }
    }

    async function checkActiveSupportSession() {
        const btn = document.getElementById('returnSupportSessionBtn');

        if (!btn) {
            console.warn('returnSupportSessionBtn not found');
            return;
        }

        btn.style.display = 'none';
        btn.onclick = null;

        try {
            const operatorResponse = await fetch('/api/support/sessions/my-active/operator', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (operatorResponse.ok && operatorResponse.status !== 204) {
                const session = await operatorResponse.json();

                if (session && session.sessionCode) {
                    btn.style.display = 'inline-flex';
                    btn.innerText = '🛠 Вернуться в техподдержку';
                    btn.onclick = function () {
                        window.location.href =
                            '/support-operator.html?code=' + encodeURIComponent(session.sessionCode);
                    };
                    return;
                }
            }
        } catch (e) {
            console.warn('Support operator session check failed:', e);
        }

        try {
            const clientResponse = await fetch('/api/support/sessions/my-active/client', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (clientResponse.ok && clientResponse.status !== 204) {
                const session = await clientResponse.json();

                if (session && session.sessionCode) {
                    btn.style.display = 'inline-flex';
                    btn.innerText = '🛠 Вернуться в техподдержку';
                    btn.onclick = function () {
                        window.location.href =
                            '/support-client.html?code=' + encodeURIComponent(session.sessionCode);
                    };
                    return;
                }
            }
        } catch (e) {
            console.warn('Support client session check failed:', e);
        }

        btn.style.display = 'none';
        btn.onclick = null;
    }

    function getStatusClass(status) {
        return status ? status.toLowerCase() : 'offline';
    }

    function getPowerButton(pc) {
        const status = String(pc.status || 'OFFLINE').toUpperCase();

        if (status === 'SLEEP' || status === 'SOFT_SLEEP') {
            return `
                <button class="btn-primary"
                        style="width:100%;justify-content:center;margin-top:10px;background:linear-gradient(135deg,#10b981,#059669);"
                        onclick="event.stopPropagation(); sendPowerCommand(${pc.id}, 'SOFT_WAKE')">
                    ⚡ Умное пробуждение
                </button>
            `;
        }

        if (status === 'ONLINE') {
            return `
                <button class="btn-glass"
                        style="width:100%;justify-content:center;margin-top:10px;background:rgba(245,158,11,0.2);border-color:rgba(245,158,11,0.5);"
                        onclick="event.stopPropagation(); sendPowerCommand(${pc.id}, 'SOFT_SLEEP')">
                    🌙 Умный сон
                </button>
            `;
        }

        return `
            <button class="btn-glass"
                    style="width:100%;justify-content:center;margin-top:10px;opacity:0.55;cursor:not-allowed;"
                    onclick="event.stopPropagation(); alert('ПК сейчас недоступен')">
                ⚫ Недоступен
            </button>
        `;
    }

    async function loadPCs() {
        try {
            const response = await fetch('/pcs', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.status === 401 || response.status === 403) {
                localStorage.removeItem('token');
                window.location.href = '/login.html';
                return;
            }

            const pcs = await response.json();
            pcsCache = pcs;

            const grid = document.getElementById('pcsGrid');

            if (pcs.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;"><div style="font-size:64px;">💻</div><p>No computers found</p></div>';
                return;
            }

            grid.innerHTML = pcs.map(pc => `
                <div class="pc-card fade-in-up" onclick="openScenarioModal(${pc.id}, '${escapeHtml(pc.name)}')">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                        <div style="width:48px;height:48px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:16px;display:flex;align-items:center;justify-content:center;">💻</div>
                        <span class="status-${getStatusClass(pc.status)}">${pc.status || 'OFFLINE'}</span>
                    </div>

                    <h3 style="font-size:20px;margin-bottom:6px;">${escapeHtml(pc.name)}</h3>

                    <p style="color:rgba(255,255,255,0.4);font-size:12px;margin-bottom:16px;">
                        🔌 ${escapeHtml(pc.macAddress)}
                    </p>

                    <div style="border-top:1px solid rgba(255,255,255,0.1);margin:16px 0;"></div>

                    <div style="display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:16px;">
                        <span>🕐 Last seen:</span>
                        <span>${pc.lastConnection ? new Date(pc.lastConnection).toLocaleString() : 'Never'}</span>
                    </div>

                    <button class="btn-primary"
                            style="width:100%;justify-content:center;"
                            onclick="event.stopPropagation(); openScenarioModal(${pc.id}, '${escapeHtml(pc.name)}')">
                        🔌 Connect
                    </button>

                    ${getPowerButton(pc)}
                </div>
            `).join('');

        } catch (e) {
            console.error(e);
        }
    }

    function openScenarioModal(id, name) {
        selectedPcId = id;
        selectedPcName = name;

        document.getElementById('scenarioPcName').innerText = 'ПК: ' + name;
        document.getElementById('scenarioModalBackdrop').style.display = 'flex';

        applyPcsMobileState();
    }

    function closeScenarioModal() {
        document.getElementById('scenarioModalBackdrop').style.display = 'none';
        selectedPcId = null;
        selectedPcName = null;
    }

    function connectWithProfile(profile) {
        if (!selectedPcId || !selectedPcName) {
            alert('ПК не выбран');
            return;
        }

        window.location.href =
            `/watch.html?pcId=${selectedPcId}&pcName=${encodeURIComponent(selectedPcName)}&profile=${encodeURIComponent(profile)}`;
    }

    function openMobileRemote() {
        if (!selectedPcId || !selectedPcName) {
            alert('ПК не выбран');
            return;
        }

        if (!isCurrentDeviceMobile()) {
            alert('Многофункциональный пульт доступен только с телефона или планшета');
            return;
        }

        window.location.href =
            `/mobile-remote.html?pcId=${selectedPcId}&pcName=${encodeURIComponent(selectedPcName)}`;
    }

    function openSupportCreatePage() {
        window.location.href = '/support-create.html';
    }

    function showScenarioInProgress(profile) {
        alert('Этот сценарий доступен только с телефона или планшета: ' + profile);
    }

    function sendPowerCommand(pcId, action) {
        const confirmText = action === 'SOFT_SLEEP'
            ? 'Перевести ПК в умный сон?'
            : 'Вывести ПК из умного сна?';

        if (!confirm(confirmText)) return;

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsPort = window.location.port || (window.location.protocol === 'https:' ? '443' : '80');
        const socket = new WebSocket(`${wsProtocol}//${window.location.hostname}:${wsPort}/ws/client`);

        socket.onopen = () => {
            socket.send(JSON.stringify({
                type: 'command',
                pcId: parseInt(pcId),
                action: action,
                profile: 'personal'
            }));

            setTimeout(() => {
                socket.close();
                loadPCs();
            }, 500);
        };

        socket.onerror = () => {
            alert('Не удалось отправить команду');
        };
    }

    function escapeHtml(str) {
        if (!str) return '';

        return String(str).replace(/[&<>"']/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            if (m === "'") return '&#39;';
            return m;
        });
    }

    function logout() {
        localStorage.removeItem('token');
        window.location.href = '/login.html';
    }

    document.getElementById('scenarioModalBackdrop').addEventListener('click', (e) => {
        if (e.target.id === 'scenarioModalBackdrop') {
            closeScenarioModal();
        }
    });

    applyPcsMobileState();

    window.addEventListener('resize', applyPcsMobileState);
    window.addEventListener('orientationchange', () => {
        setTimeout(applyPcsMobileState, 300);
    });

    loadPCs();
    checkActiveTeacherSession();
    checkActiveSupportSession();

    setInterval(loadPCs, 10000);
    setInterval(checkActiveTeacherSession, 5000);
    setInterval(checkActiveSupportSession, 5000);
</script>
</body>
</html>
