<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote PC - Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
<div class="glass-card fade-in-up" style="max-width: 400px; width: 100%; padding: 40px; text-align: center;">
    <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">💻</div>
    <h1 style="font-size: 28px; margin-bottom: 8px;">Remote PC</h1>
    <p style="color: rgba(255,255,255,0.5); margin-bottom: 30px;">Access your computers from anywhere</p>

    <form id="loginForm">
        <input type="text" id="username" class="input-field" placeholder="Username" style="margin-bottom: 16px;">
        <input type="password" id="password" class="input-field" placeholder="Password" style="margin-bottom: 24px;">
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">Sign In</button>
    </form>

    <div id="error" style="margin-top: 16px; color: #f87171; font-size: 14px; display: none;">❌ Invalid username or password</div>

    <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1);">
        <p style="color: rgba(255,255,255,0.5); font-size: 14px;">Don't have an account? <a href="/register.html" style="color: #3b82f6;">Sign Up</a></p>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('error');
        errorDiv.style.display = 'none';

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.token);
                window.location.href = '/pcs.html';
            } else {
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            errorDiv.style.display = 'block';
        }
    });
</script>
</body>
</html>
