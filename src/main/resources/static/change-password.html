<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote PC - Change Password</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
<div class="glass-card fade-in-up" style="max-width: 400px; width: 100%; padding: 40px; text-align: center;">
    <h1 style="font-size: 28px; margin-bottom: 30px;">Change Password</h1>

    <form id="changeForm">
        <input type="password" id="oldPassword" class="input-field" placeholder="Current Password" style="margin-bottom: 16px;">
        <input type="password" id="newPassword" class="input-field" placeholder="New Password (min 6 chars)" style="margin-bottom: 16px;">
        <input type="password" id="confirmPassword" class="input-field" placeholder="Confirm New Password" style="margin-bottom: 24px;">
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">Update Password</button>
    </form>

    <div id="error" style="margin-top: 16px; color: #f87171; font-size: 14px; display: none;"></div>
    <div id="success" style="margin-top: 16px; color: #34d399; font-size: 14px; display: none;"></div>

    <div style="margin-top: 24px;">
        <a href="/pcs.html" style="color: #3b82f6;">← Back to Computers</a>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    document.getElementById('changeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';

        const oldPassword = document.getElementById('oldPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (newPassword !== confirm) {
            errorDiv.innerText = 'Passwords do not match';
            errorDiv.style.display = 'block';
            return;
        }

        if (newPassword.length < 6) {
            errorDiv.innerText = 'Password must be at least 6 characters';
            errorDiv.style.display = 'block';
            return;
        }

        try {
            const response = await fetch('/auth/change-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ oldPassword, newPassword })
            });
            const data = await response.json();

            if (response.ok) {
                successDiv.innerText = 'Password changed successfully!';
                successDiv.style.display = 'block';
                setTimeout(() => { window.location.href = '/pcs.html'; }, 2000);
            } else {
                errorDiv.innerText = data.error || 'Failed to change password';
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            errorDiv.innerText = 'Network error';
            errorDiv.style.display = 'block';
        }
    });
</script>
</body>
</html>
