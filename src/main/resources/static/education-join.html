<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Join Education Session</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <script src="/js/mobile-utils.js"></script>

    <style>
        body {
            padding: 24px;
        }

        .page {
            max-width: 760px;
            margin: 0 auto;
        }

        .card {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(59,130,246,0.25);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.28);
        }

        .form-label {
            display: block;
            color: #93c5fd;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.08);
            color: white;
            outline: none;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 18px;
        }

        .result-card {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(16,185,129,0.35);
            background: rgba(16,185,129,0.09);
        }

        .waiting-card {
            border-color: rgba(245,158,11,0.35);
            background: rgba(245,158,11,0.09);
        }

        .rejected-card {
            border-color: rgba(239,68,68,0.4);
            background: rgba(239,68,68,0.1);
        }

        .error-box {
            display: none;
            margin-top: 16px;
            border: 1px solid rgba(239,68,68,0.4);
            background: rgba(239,68,68,0.1);
            color: #fecaca;
            border-radius: 16px;
            padding: 14px;
            font-size: 14px;
        }

        .muted {
            color: rgba(255,255,255,0.55);
        }

        .status-text {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .status-code {
            color: #93c5fd;
            font-size: 13px;
            margin-top: 8px;
        }
        @media (max-width: 900px), (pointer: coarse) {
            .page {
                max-width: none;
                width: 100%;
            }

            .education-header-actions {
                display: grid !important;
                grid-template-columns: 1fr !important;
                width: 100%;
                gap: 10px !important;
            }

            #joinBtn {
                margin-bottom: 12px;
            }
        }
    </style>
</head>

<body class="mobile-screen-page">
<div class="page mobile-screen-wrapper">
    <div class="mobile-header-stack" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:16px;flex-wrap:wrap;">
        <div>
            <h1 class="mobile-title" style="font-size:32px;">🎓 Подключение к учебной сессии</h1>
            <p class="muted">Введите код, который дал преподаватель.</p>
        </div>

        <div class="education-header-actions" style="display:flex;gap:12px;">
            <button class="btn-glass mobile-big-button" onclick="location.href='/pcs.html'">← Назад</button>
            <button class="btn-glass mobile-big-button" onclick="logout()">🚪 Logout</button>
        </div>
    </div>

    <div class="card mobile-screen-card">
        <label class="form-label" for="sessionCodeInput">Код сессии</label>
        <input id="sessionCodeInput" class="form-input mobile-big-input" maxlength="6" placeholder="Например: 160198">

        <label class="form-label" for="displayNameInput">Ваше имя в сессии</label>
        <input id="displayNameInput" class="form-input mobile-big-input" placeholder="Например: Анна Иванова">

        <button id="joinBtn" class="btn-primary mobile-big-button" onclick="joinSession()">
            Подключиться
        </button>

        <button class="btn-glass mobile-big-button" onclick="returnToActiveStudentSession()">
            🔁 Вернуться в текущую сессию
        </button>

        <div id="errorBox" class="error-box"></div>

        <div id="resultCard" class="result-card waiting-card">
            <div id="statusTitle" class="status-text">⏳ Заявка отправлена преподавателю</div>

            <p class="muted">
                Ваш статус: <strong id="participantStatus">WAITING</strong>
            </p>

            <p id="statusDescription" class="muted">
                Ожидаем подтверждения преподавателя. Страница будет обновлять статус автоматически.
            </p>

            <div id="sessionInfo" class="status-code"></div>

            <div id="approvedActions" style="display:none;margin-top:18px;">
                <button class="btn-primary mobile-big-button" onclick="openStudentSession()">
                    🎓 Войти в учебную сессию
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');

    if (!token) {
        window.location.href = '/login.html';
    }

    let currentSessionCode = null;
    let currentParticipantId = null;
    let statusTimer = null;

    async function joinSession() {
        hideError();

        const sessionCode = document.getElementById('sessionCodeInput').value.trim();
        const displayName = document.getElementById('displayNameInput').value.trim();
        const btn = document.getElementById('joinBtn');

        if (!sessionCode || sessionCode.length !== 6) {
            showError('Введите 6-значный код сессии');
            return;
        }

        btn.disabled = true;
        btn.style.display = 'inline-flex';
        btn.style.opacity = '0.65';
        btn.innerText = 'Отправка заявки...';

        try {
            const response = await fetch('/api/education/participants/join', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    sessionCode: sessionCode,
                    displayName: displayName
                })
            });

            if (!response.ok) {
                resetJoinButton();
                await handleJoinError(response);
                return;
            }

            const participant = await response.json();

            currentSessionCode = participant.sessionCode;
            currentParticipantId = participant.id;

            localStorage.setItem('activeEducationSessionCode', currentSessionCode);

            document.getElementById('sessionInfo').innerText =
                'Код сессии: ' + currentSessionCode;

            renderStatus(participant.status);
            document.getElementById('resultCard').style.display = 'block';

            startStatusPolling();

        } catch (e) {
            resetJoinButton();
            showError('Не удалось подключиться к серверу');
        }
    }

    async function handleJoinError(response) {
        let text = '';

        try {
            text = await response.text();
        } catch (e) {
            text = '';
        }

        let message = text;

        try {
            const json = JSON.parse(text);
            message = json.message || json.error || text;
        } catch (e) {
            message = text;
        }

        const lowerMessage = String(message || '').toLowerCase();

        if (
            response.status === 400 ||
            response.status === 404 ||
            response.status === 500 ||
            lowerMessage.includes('не найден') ||
            lowerMessage.includes('не найдена') ||
            lowerMessage.includes('not found') ||
            lowerMessage.includes('сессия') ||
            lowerMessage.includes('session')
        ) {
            showError('Учебная сессия с таким кодом не найдена');
            return;
        }

        showError('Не удалось отправить заявку на подключение');
    }

    async function checkMyStatus() {
        if (!currentSessionCode) return;

        try {
            const response = await fetch('/api/education/participants/my/' + encodeURIComponent(currentSessionCode), {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                await handleStatusError(response);
                return;
            }

            const participant = await response.json();

            renderStatus(participant.status);

            if (participant.status === 'APPROVED' || participant.status === 'REJECTED' || participant.status === 'RECONNECTED' || participant.status === 'ONLINE') {
                stopStatusPolling();
            }

        } catch (e) {
            showError('Не удалось проверить статус подключения');
            stopStatusPolling();
        }
    }

    async function handleStatusError(response) {
        let text = '';

        try {
            text = await response.text();
        } catch (e) {
            text = '';
        }

        let message = text;

        try {
            const json = JSON.parse(text);
            message = json.message || json.error || text;
        } catch (e) {
            message = text;
        }

        const lowerMessage = String(message || '').toLowerCase();

        if (
            response.status === 400 ||
            response.status === 404 ||
            response.status === 500 ||
            lowerMessage.includes('не найден') ||
            lowerMessage.includes('не найдена') ||
            lowerMessage.includes('not found')
        ) {
            showError('Учебная сессия с таким кодом не найдена');
        } else {
            showError('Не удалось проверить статус учебной сессии');
        }

        stopStatusPolling();
    }

    function startStatusPolling() {
        stopStatusPolling();

        statusTimer = setInterval(checkMyStatus, 2000);
    }

    function stopStatusPolling() {
        if (statusTimer) {
            clearInterval(statusTimer);
            statusTimer = null;
        }
    }

    function renderStatus(status) {
        const resultCard = document.getElementById('resultCard');
        const statusTitle = document.getElementById('statusTitle');
        const participantStatus = document.getElementById('participantStatus');
        const statusDescription = document.getElementById('statusDescription');
        const approvedActions = document.getElementById('approvedActions');
        const joinBtn = document.getElementById('joinBtn');

        participantStatus.innerText = status;

        resultCard.classList.remove('waiting-card', 'rejected-card');

        if (status === 'WAITING') {
            resultCard.classList.add('waiting-card');
            statusTitle.innerText = '⏳ Заявка отправлена преподавателю';
            statusDescription.innerText = 'Ожидаем подтверждения преподавателя. Страница будет обновлять статус автоматически.';
            approvedActions.style.display = 'none';

            joinBtn.style.display = 'inline-flex';
            joinBtn.disabled = true;
            joinBtn.style.opacity = '0.65';
            joinBtn.innerText = '⏳ Заявка отправлена';
            return;
        }

        if (status === 'APPROVED' || status === 'RECONNECTED' || status === 'ONLINE') {
            statusTitle.innerText = '✅ Преподаватель подтвердил подключение';
            statusDescription.innerText = 'Теперь вы можете войти в учебную сессию.';
            approvedActions.style.display = 'block';

            joinBtn.style.display = 'none';
            joinBtn.disabled = true;
            return;
        }

        if (status === 'REJECTED') {
            resultCard.classList.add('rejected-card');
            statusTitle.innerText = '❌ Заявка отклонена';
            statusDescription.innerText = 'Преподаватель отклонил подключение к учебной сессии. Можно отправить заявку повторно.';
            approvedActions.style.display = 'none';

            joinBtn.style.display = 'inline-flex';
            joinBtn.disabled = false;
            joinBtn.style.opacity = '1';
            joinBtn.innerText = 'Отправить заявку повторно';
            return;
        }

        if (status === 'LEFT' || status === 'DISCONNECTED') {
            statusTitle.innerText = 'Статус заявки: ' + status;
            statusDescription.innerText = 'Можно подключиться к учебной сессии повторно.';
            approvedActions.style.display = 'none';

            joinBtn.style.display = 'inline-flex';
            joinBtn.disabled = false;
            joinBtn.style.opacity = '1';
            joinBtn.innerText = 'Подключиться повторно';
            return;
        }

        statusTitle.innerText = 'Статус заявки: ' + status;
        statusDescription.innerText = 'Текущий статус подключения обновлён.';
        approvedActions.style.display = 'none';

        joinBtn.style.display = 'inline-flex';
        joinBtn.disabled = false;
        joinBtn.style.opacity = '1';
        joinBtn.innerText = 'Подключиться';
    }

    function resetJoinButton() {
        const btn = document.getElementById('joinBtn');

        if (!btn) {
            return;
        }

        btn.style.display = 'inline-flex';
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.innerText = 'Подключиться';
    }

    function openStudentSession() {
        if (!currentSessionCode) return;

        window.location.href =
            '/education-student.html?code=' + encodeURIComponent(currentSessionCode);
    }

    function showError(message) {
        const box = document.getElementById('errorBox');
        box.innerText = '❌ ' + message;
        box.style.display = 'block';
    }

    function hideError() {
        const box = document.getElementById('errorBox');
        box.innerText = '';
        box.style.display = 'none';
    }

    function logout() {
        stopStatusPolling();
        localStorage.removeItem('token');
        window.location.href = '/login.html';
    }

    window.addEventListener('beforeunload', () => {
        stopStatusPolling();
    });

    async function returnToActiveStudentSession() {
        try {
            const response = await fetch('/api/education/sessions/my-active/student', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.status === 204) {
                alert('Активной сессии нет');
                return;
            }

            if (!response.ok) {
                alert('Ошибка поиска активной сессии');
                return;
            }

            const session = await response.json();

            window.location.href =
                '/education-student.html?code=' + encodeURIComponent(session.sessionCode);

        } catch (e) {
            alert('Не удалось подключиться к серверу');
        }
    }
    window.addEventListener('load', function () {
        addMobileBackButton('/pcs.html');
    });
</script>
</body>
</html>
