<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Education Session - Student</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>
        body { padding: 24px; }

        .page {
            max-width: 1100px;
            margin: 0 auto;
        }

        .card {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(59,130,246,0.25);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.28);
        }

        .muted { color: rgba(255,255,255,0.55); }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 11px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .code {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 5px;
            color: #34d399;
        }

        .preview-frame-wrap {
            height: 460px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.16);
            background: #000;
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;
            display: block;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        #controlStatus {
            width: 100%;
            margin-top: 4px;
            color: #93c5fd;
            font-size: 13px;
        }

        .chat-box {
            height: 330px;
            overflow-y: auto;
            background: rgba(0,0,0,0.22);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 18px;
            padding: 14px;
        }

        .chat-row {
            display: flex;
            margin-bottom: 12px;
        }

        .chat-row.me {
            justify-content: flex-end;
        }

        .chat-row.other {
            justify-content: flex-start;
        }

        .chat-message {
            max-width: 75%;
            padding: 10px 12px;
            border-radius: 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.10);
        }

        .chat-message.me {
            background: rgba(59,130,246,0.24);
            border: 1px solid rgba(59,130,246,0.36);
        }

        .chat-message.teacher {
            background: rgba(16,185,129,0.20);
            border: 1px solid rgba(16,185,129,0.34);
        }

        .chat-meta {
            font-size: 11px;
            color: rgba(255,255,255,0.52);
            margin-bottom: 4px;
        }

        .chat-text {
            font-size: 14px;
            line-height: 1.35;
            color: white;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .chat-form {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .chat-input {
            flex: 1;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.08);
            color: white;
            padding: 12px 14px;
            outline: none;
        }
    </style>
</head>

<body>
<div class="page">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:16px;flex-wrap:wrap;">
        <div>
            <h1 style="font-size:32px;">🎓 Учебная сессия</h1>
            <p class="muted">Режим ученика</p>
        </div>

        <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <button class="btn-glass" onclick="location.href='/education-join.html'">← К подключению</button>
            <button class="btn-glass" onclick="location.href='/pcs.html'">💻 Мои ПК</button>
            <button class="btn-glass" onclick="logout()">🚪 Logout</button>
        </div>
    </div>

    <div id="errorBox" class="card" style="display:none;border-color:rgba(239,68,68,0.4);color:#fecaca;"></div>

    <div class="card">
        <h2 id="sessionTitle">Загрузка...</h2>
        <p class="muted">Код сессии:</p>
        <div id="sessionCode" class="code">------</div>

        <div style="margin-top:18px;">
            <div class="info-row">
                <span class="muted">Статус</span>
                <strong id="sessionStatus">—</strong>
            </div>

            <div class="info-row">
                <span class="muted">Преподаватель</span>
                <strong id="teacherUsername">—</strong>
            </div>

            <div class="info-row">
                <span class="muted">ПК преподавателя</span>
                <strong id="teacherPc">—</strong>
            </div>

            <div class="info-row">
                <span class="muted">Управление</span>
                <strong id="allowControl">—</strong>
            </div>

            <div class="info-row">
                <span class="muted">Передача файлов</span>
                <strong id="allowFiles">—</strong>
            </div>

            <div class="info-row">
                <span class="muted">Демонстрация экрана</span>
                <strong id="allowScreenShare">—</strong>
            </div>
        </div>
    </div>

    <div id="sessionFinishedOverlay"
         style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;align-items:center;justify-content:center;text-align:center;color:white;">
        <div>
            <div style="font-size:72px;margin-bottom:20px;">🏁</div>
            <h1>Сессия завершена</h1>
            <p class="muted">Преподаватель завершил учебную сессию.</p>
            <button class="btn-primary" onclick="location.href='/education-join.html'">
                Вернуться к подключению
            </button>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-bottom:14px;">🖥 Экран преподавателя</h3>

        <div class="preview-frame-wrap">
            <iframe id="teacherPreviewFrame"
                    class="preview-frame"
                    allow="autoplay; fullscreen">
            </iframe>
        </div>

        <div class="actions">
            <button class="btn-primary" onclick="openTeacherScreen()">
                👁️ Открыть экран отдельно
            </button>

            <button id="requestControlBtn" class="btn-primary" onclick="requestControl()">
                🎮 Запросить управление
            </button>

            <button class="btn-glass" onclick="alert('Передачу файлов ученика добавим следующим шагом')">
                📂 Передать файл преподавателю
            </button>

            <button class="btn-glass" onclick="alert('Демонстрацию экрана ученика добавим следующим шагом')">
                📺 Показать свой экран
            </button>

            <button class="btn-glass"
                    onclick="leaveSession()"
                    style="background:rgba(239,68,68,0.18);border-color:rgba(239,68,68,0.45);">
                🚪 Выйти из сессии
            </button>

            <div id="controlStatus"></div>
        </div>
    </div>

    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;">
            <h3>💬 Чат с преподавателем</h3>
            <button class="btn-glass" onclick="loadChatMessages()">🔄 Обновить чат</button>
        </div>

        <div id="chatMessages" class="chat-box">
            <div class="muted" style="text-align:center;padding:30px;">
                Сообщений пока нет.
            </div>
        </div>

        <div class="chat-form">
            <input id="chatInput"
                   class="chat-input"
                   type="text"
                   maxlength="2000"
                   placeholder="Написать преподавателю...">

            <button class="btn-primary" onclick="sendChatMessage()">
                Отправить
            </button>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');

    if (!token) {
        window.location.href = '/login.html';
    }

    const params = new URLSearchParams(window.location.search);
    const sessionCode = params.get('code');

    if (!sessionCode) {
        showError('Не указан код учебной сессии');
    }

    let currentSession = null;
    let participantStatusTimer = null;
    let chatTimer = null;
    let lastChatHtml = '';
    let previewInitialized = false;

    async function loadSession() {
        try {
            hideError();

            const response = await fetch('/api/education/sessions/' + encodeURIComponent(sessionCode), {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            currentSession = await response.json();

            if (currentSession.status === 'FINISHED') {
                document.getElementById('sessionFinishedOverlay').style.display = 'flex';
                return;
            }

            document.getElementById('sessionTitle').innerText = currentSession.title;
            document.getElementById('sessionCode').innerText = currentSession.sessionCode;
            document.getElementById('sessionStatus').innerText = currentSession.status;
            document.getElementById('teacherUsername').innerText = currentSession.teacherUsername || '—';
            document.getElementById('teacherPc').innerText = currentSession.teacherPcName || '—';
            document.getElementById('allowControl').innerText = currentSession.allowStudentControl ? 'Разрешено' : 'Запрещено';
            document.getElementById('allowFiles').innerText = currentSession.allowFileTransfer ? 'Разрешена' : 'Запрещена';
            document.getElementById('allowScreenShare').innerText = currentSession.allowStudentScreenShare ? 'Разрешена' : 'Запрещена';

            if (!previewInitialized) {
                setupTeacherPreview();
                previewInitialized = true;
            }

            if (!currentSession.allowStudentControl) {
                const btn = document.getElementById('requestControlBtn');
                btn.disabled = true;
                btn.style.opacity = '0.55';
                btn.innerText = '🎮 Управление запрещено';
                document.getElementById('controlStatus').innerText =
                    'В настройках этой учебной сессии управление учениками запрещено.';
            }

            await loadParticipantStatus();

        } catch (e) {
            showError(e.message);
        }
    }

    function setupTeacherPreview() {
        if (!currentSession || !currentSession.teacherPcId) {
            return;
        }

        const frame = document.getElementById('teacherPreviewFrame');

        frame.src =
            '/watch.html?pcId=' + encodeURIComponent(currentSession.teacherPcId) +
            '&pcName=' + encodeURIComponent(currentSession.teacherPcName || 'Teacher PC') +
            '&profile=education_student' +
            '&educationCode=' + encodeURIComponent(currentSession.sessionCode) +
            '&embedded=1' +
            '&readonly=1';
    }

    async function loadParticipantStatus() {
        if (!currentSession || !currentSession.id) return;

        try {
            const response = await fetch('/api/education/participants/status/' + encodeURIComponent(currentSession.id), {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                return;
            }

            const participant = await response.json();
            updateControlUi(participant);

        } catch (e) {
            console.warn('Cannot load participant status:', e);
        }
    }

    function updateControlUi(participant) {
        const btn = document.getElementById('requestControlBtn');
        const status = document.getElementById('controlStatus');

        if (!currentSession || !currentSession.allowStudentControl) {
            return;
        }

        if (participant.hasControl) {
            btn.disabled = true;
            btn.style.opacity = '0.7';
            btn.innerText = '✅ Управление разрешено';
            status.innerText = 'Преподаватель разрешил управление. Нажмите “Открыть экран отдельно”, чтобы включить управление.';
            return;
        }

        if (participant.controlRequested) {
            btn.disabled = true;
            btn.style.opacity = '0.7';
            btn.innerText = '⏳ Запрос отправлен';
            status.innerText = 'Запрос управления отправлен преподавателю. Ожидайте подтверждения.';
            return;
        }

        btn.disabled = false;
        btn.style.opacity = '1';
        btn.innerText = '🎮 Запросить управление';
        status.innerText = '';
    }

    async function requestControl() {
        try {
            hideError();

            const response = await fetch('/api/education/participants/control/request', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    sessionCode: sessionCode
                })
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            const participant = await response.json();
            updateControlUi(participant);

        } catch (e) {
            alert('Ошибка запроса управления: ' + e.message);
        }
    }

    function openTeacherScreen() {
        if (!currentSession) {
            showError('Сессия ещё не загружена');
            return;
        }

        if (!currentSession.teacherPcId) {
            showError('У сессии не указан ПК преподавателя');
            return;
        }

        window.location.href =
            '/watch.html?pcId=' + encodeURIComponent(currentSession.teacherPcId) +
            '&pcName=' + encodeURIComponent(currentSession.teacherPcName || 'Teacher PC') +
            '&profile=education_student' +
            '&educationCode=' + encodeURIComponent(currentSession.sessionCode);
    }

    async function loadChatMessages() {
        if (!currentSession || !currentSession.sessionCode) return;

        try {
            const response = await fetch('/api/education/chat/' + encodeURIComponent(currentSession.sessionCode), {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            const messages = await response.json();
            renderChatMessages(messages);

        } catch (e) {
            console.warn('Ошибка загрузки чата:', e.message);
        }
    }

    function renderChatMessages(messages) {
        const box = document.getElementById('chatMessages');
        if (!box) return;

        if (!messages || messages.length === 0) {
            box.innerHTML = `
                <div class="muted" style="text-align:center;padding:30px;">
                    Сообщений пока нет.
                </div>
            `;
            return;
        }

        const currentUsername = localStorage.getItem('username');

        const html = messages.map(message => {
            const sender = escapeHtml(message.senderUsername || 'unknown');
            const text = escapeHtml(message.message || '');
            const time = message.createdAt
                ? new Date(message.createdAt).toLocaleTimeString()
                : '';

            const isMine = currentUsername && message.senderUsername === currentUsername;
            const isTeacher = currentSession && message.senderUsername === currentSession.teacherUsername;

            return `
                <div class="chat-row ${isMine ? 'me' : 'other'}">
                    <div class="chat-message ${isMine ? 'me' : ''} ${isTeacher ? 'teacher' : ''}">
                        <div class="chat-meta">${sender} · ${time}</div>
                        <div class="chat-text">${text}</div>
                    </div>
                </div>
            `;
        }).join('');

        if (html !== lastChatHtml) {
            box.innerHTML = html;
            box.scrollTop = box.scrollHeight;
            lastChatHtml = html;
        }
    }

    async function sendChatMessage() {
        if (!currentSession || !currentSession.sessionCode) {
            showError('Сессия ещё не загружена');
            return;
        }

        const input = document.getElementById('chatInput');
        const text = input.value.trim();

        if (!text) return;

        try {
            const response = await fetch('/api/education/chat/' + encodeURIComponent(currentSession.sessionCode), {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: text,
                    recipientId: null
                })
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            input.value = '';
            await loadChatMessages();

        } catch (e) {
            alert('Ошибка отправки сообщения: ' + e.message);
        }
    }

    async function leaveSession() {
        if (!confirm('Выйти из учебной сессии?')) return;

        const response = await fetch('/api/education/participants/leave', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                sessionCode: sessionCode
            })
        });

        if (!response.ok) {
            alert('Ошибка выхода из сессии');
            return;
        }

        window.location.href = '/education-join.html';
    }

    function showError(message) {
        const box = document.getElementById('errorBox');
        box.innerText = message;
        box.style.display = 'block';
    }

    function hideError() {
        const box = document.getElementById('errorBox');
        box.innerText = '';
        box.style.display = 'none';
    }

    function escapeHtml(str) {
        if (!str) return '';

        return String(str).replace(/[&<>"]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            return m;
        });
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        window.location.href = '/login.html';
    }

    async function init() {
        await loadSession();
        await loadChatMessages();

        participantStatusTimer = setInterval(async () => {
            await loadSession();
            await loadParticipantStatus();
        }, 3000);

        chatTimer = setInterval(loadChatMessages, 2500);
    }

    window.addEventListener('beforeunload', () => {
        if (participantStatusTimer) {
            clearInterval(participantStatusTimer);
        }

        if (chatTimer) {
            clearInterval(chatTimer);
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'chatInput') {
            e.preventDefault();
            sendChatMessage();
        }
    });

    init();
</script>
</body>
</html>
