# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/remote_pc_db
spring.datasource.username=remote_user
spring.datasource.password=remote_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=mySuperSecretKeyForJWT1234567890123456789012345678901234567890
jwt.expiration.ms=86400000

# Server HTTPS
server.address=0.0.0.0
server.port=8443

server.ssl.enabled=true
server.ssl.key-store=remote-pc-keystore.p12
server.ssl.key-store-password=123456
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=remote-pc

# WebSocket buffer size
server.tomcat.websocket.buffer-size-max=5242880
spring.webflux.multipart.max-in-memory-size=5242880

# Upload limits
server.tomcat.max-http-form-post-size=500MB
server.tomcat.max-swallow-size=500MB
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

spring.main.allow-circular-references=true

# Wake-on-LAN
power.wol.broadcast-address=255.255.255.255
power.wol.port=9

# Remote files
remote.server.public-url=https://192.168.50.22:8443
remote.files.storage-dir=uploads/remote-files
remote.files.max-age-hours=24
remote.files.cleanup-delay-ms=3600000